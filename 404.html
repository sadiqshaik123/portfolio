<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Shaik Sadiq</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dark-theme.css">
<link rel="stylesheet" href="assets/css/light-theme.css">
<link rel="stylesheet" href="assets/css/buttons.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
.error-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}
.error-content{
max-width:700px;
}
.error-code{
font-size:140px;
font-weight:900;
line-height:1;
background:linear-gradient(90deg,#2563EB,#7C3AED);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}
.error-title{
font-size:42px;
margin-bottom:20px;
}
.error-text{
font-size:18px;
color:var(--text-light);
margin-bottom:40px;
}
.error-buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}
</style>
</head>

<body class="dark-theme">

<section class="error-page">

<div class="error-content reveal fade-up">

<div class="error-code">404</div>

<h1 class="error-title">Oops! Page Not Found</h1>

<p class="error-text">
The page you're looking for doesn't exist, has been moved,
or the URL may be incorrect.
</p>

<div class="error-buttons">

<a href="index.html" class="btn btn-primary">
<i class="fa-solid fa-house"></i>
Back to Home
</a>

<a href="contact.html" class="btn btn-outline">
<i class="fa-solid fa-envelope"></i>
Contact Me
</a>

</div>

<div style="margin-top:50px;">
<img src="assets/images/profile.png"
alt="Shaik Sadiq"
style="width:180px;border-radius:50%;box-shadow:0 15px 35px rgba(0,0,0,.3);">
</div>

<p style="margin-top:40px;color:var(--text-light);">
© <span id="year"></span> Shaik Sadiq Portfolio
</p>

</div>

</section>

<script src="assets/js/theme.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/script.js"></script>

</body>
</html>
